# The objective form-filling round (owner, 27 Oct 2026; plan https://claude.ai/artifact/XUfZSmYU2oai83HvW5LBnx). Started by hand, or each
# Monday by form-weekly.yml: ours alone on the fixed set (owner, 27 Oct 2026, via 5b: "Weekly, ours only (Recommended)": "catches our
# regressions") and the new set (owner: "Both (Recommended)"). A full round with every rival on the fixed set stays by hand
# (test/workflows.test.mjs). A weekly run (`weekly=yes`) ends with one Telegram message against the baseline and last week
# (weekly-note.mjs; owner: "It should send to telegram, as notification the results, and compare with a baseline"). One job per (tool, run), all started together, each on a
# fresh runner: every tool on the same day and the same model (BENCH_MODEL), every form visited once per job (at most 2 visits per hiring-system
# host per job; the round's own one-day limit, owner's yes 27 Oct 2026). Never Submit (lib/guard.mjs), fake applicant only.
# Cost: each job stops between forms at its cap; the caps add up to about $3 at most (trial: $0.017-0.042 an agent run on Haiku 5.5).
# With `publish` set, a last job judges the round blind (judge-blind.mjs, the Claude plan, $0), scores it (score-round.mjs) and sends it to
# /admin/form-filling/benchmark (publish-fair.mjs): every round publishes itself (owner via 6e, 27 Oct 2026; test/workflows). 'fixed' judges
# the new runs inside the frozen fixed set (rounds/fixed/: rivals and verdicts of 27 Oct), in place of the same tool's runs; a week judges alone.
# judge_only keeps the fresh run isolated: judge and score its new artifacts, with no admin publication or Telegram (owner via 6b, 27 Oct 2026).
name: form round (by hand)
on:
  workflow_dispatch:
    inputs:
      forms:
        description: The forms file (pick-forms.mjs output)
        default: forms-objective.json
      forms_from:
        description: Take the forms file from another branch, branch:path (the weekly draw - weekly-picks:weekly/2026-W45.json); empty - this ref
        default: ''
      publish:
        description: Judge, score and publish as round fixed or week-YYYY-Www (empty - only the runs; a side check of an older build stays unpublished)
        default: ''
      judge_only:
        description: Judge and score only this run's new artifacts; do not publish or send Telegram
        type: boolean
        default: false
      weekly:
        description: yes - a weekly run (form-weekly.yml) - ends with the Telegram note and keeps it on weekly-picks
        default: ''
      product_ref:
        description: The Jobadabra commit or branch our leg runs (GarryOne/jobadabra)
        default: main
      agent_cap:
        description: USD cap per agent job (9 jobs)
        default: '0.30'
      runs:
        description: Run numbers, JSON (a smoke before a round - '[1]')
        default: '[1,2,3]'
      only:
        description: Form ids to run, comma list (empty - all; a smoke uses a form outside the round)
        default: ''
      tools:
        description: Tools, JSON (a round runs all four; one tool alone is a side check, e.g. an older build of ours)
        default: '["browser-use","stagehand","nanobrowser","extension"]'
permissions:
  contents: read
env:
  BENCH_MODEL: claude-haiku-5-5
jobs:
  build:   # resolves product_ref ONCE: a branch can move or be deleted mid-round (27 Oct 2026, all jobs failed at checkout); test/workflows
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha   # the commits API takes a branch, tag, short or full commit (actions/checkout refuses a short one: 27 Oct 2026)
        env: {GH_TOKEN: '${{ github.token }}', REF: '${{ inputs.product_ref }}'}
        run: |
          sha=$(gh api "repos/GarryOne/jobadabra/commits/$REF" --jq .sha) && test ${#sha} = 40
          echo "sha=$sha" | tee -a "$GITHUB_OUTPUT"
  run:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(inputs.tools) }}
        run: ${{ fromJSON(inputs.runs) }}   # every tool on BENCH_MODEL; no extra "as shipped" run (owner, 27 Oct 2026: the same AI for all)
    env:
      BENCH_ANTHROPIC_KEY: ${{ secrets.BENCH_ANTHROPIC_KEY }}   # the Benchmarks workspace key ($5/month limit), held by the metering pass-through
      E2E_ANTHROPIC_KEY: ${{ secrets.BENCH_ANTHROPIC_KEY }}     # our leg: the app's API engine on CI reads this name (desktop/e2e/lib/engine.mjs)
      JP_REPO: ${{ github.workspace }}/jp/desktop/e2e
      JOB_PILOTTO_HEAVY: '0'
      JOB_PILOTTO_SESSION: form round ${{ github.run_id }} ${{ matrix.tool }} ${{ matrix.run }}
      JOB_PILOTTO_VISIT_KIND: hand
      JOB_PILOTTO_SITE_LEDGER_DIR: ${{ github.workspace }}/ledger
      LIVE_ELIGIBILITY: 'off'   # ours fills like every tool: the bench asks each to fill the application (owner via 6e, 27 Oct 2026); the page says so
      JP_NO_REPORT: '1'
      ANONYMIZED_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: The harness, a browser and a virtual display
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium chromium-headless-shell
          sudo apt-get install -y -qq xvfb >/dev/null
      - name: Browser Use (pinned, requirements.txt)
        if: matrix.tool == 'browser-use'
        run: python -m venv venv && venv/bin/pip install -q -r requirements.txt
      - name: Nanobrowser (release v0.2.0)
        if: matrix.tool == 'nanobrowser'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release download v0.2.0 -R nanobrowser/nanobrowser -p 'nanobrowser-v0.2.0.zip' -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/nb-0.2.0" && unzip -q "$RUNNER_TEMP/nanobrowser-v0.2.0.zip" -d "$RUNNER_TEMP/nb-0.2.0"
          echo "NANOBROWSER_DIR=$RUNNER_TEMP/nb-0.2.0" >> "$GITHUB_ENV"
      - name: Jobadabra (public repo) at the asked commit (every tool reads its fake applicant, CV file and site ledger)
        uses: actions/checkout@v5
        with: {repository: GarryOne/jobadabra, ref: '${{ needs.build.outputs.sha }}', path: jp, persist-credentials: false}
      - name: Jobadabra's test harness
        run: |
          (cd jp/desktop/e2e && (npm ci || npm install))
          echo "our build: $(git -C jp rev-parse --short HEAD)"
      - name: Jobadabra's app (our leg)
        if: matrix.tool == 'extension'
        run: |
          (cd jp/desktop && npm ci)
          (cd jp/desktop/e2e && npx playwright-core install --with-deps chromium)
          pip install --quiet -r jp/requirements.txt
      - name: The forms file from the weekly-picks branch
        if: inputs.forms_from != ''
        env: {FROM: '${{ inputs.forms_from }}', FORMS: '${{ inputs.forms }}'}
        run: git fetch -q --depth 1 origin "${FROM%%:*}" && git show "FETCH_HEAD:${FROM#*:}" > "$FORMS"
      - name: The round's forms, this tool, this run
        run: |
          set -o pipefail
          case "${{ matrix.tool }}" in extension) cap=0.05;; *) cap="${{ inputs.agent_cap }}";; esac
          xvfb-run -a --server-args='-screen 0 1440x900x24' node round-job.mjs --tool "${{ matrix.tool }}" --run "${{ matrix.run }}" \
            --forms "${{ inputs.forms }}" --only "${{ inputs.only }}" --out round-out --cap "$cap" 2>&1 | tee round.log
      - name: This job's runs (no network records, no captured pages)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: form-round-${{ matrix.tool }}-${{ matrix.run }}
          retention-days: 30
          path: |
            round.log
            round-out/**/result.json
            round-out/**/fields.json
            round-out/**/manifest.json
            round-out/**/guard.jsonl
            round-out/**/run.log
            round-out/**/fill.log
            round-out/**/start.png
            round-out/**/end.png
            round-out/job-*.json
  publish:   # every round publishes itself as its last step (owner via 6e, 27 Oct 2026); test/workflows. A fresh runner: no contestant's code runs here
    needs: run
    if: ${{ !cancelled() && (inputs.judge_only || inputs.publish != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write   # the weekly note on branch weekly-picks
    env:
      ROUND: ${{ inputs.publish }}
      JUDGE_ONLY: ${{ inputs.judge_only }}
      CLAUDE_CODE_VERSION: 2.1.311
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - uses: actions/download-artifact@v5
        with: {pattern: form-round-*, path: arts}
      - name: The pool (fixed - the frozen set, the new runs in place of the same tool's; a week - the new runs alone)
        run: |
          mkdir -p pool
          if [ "$JUDGE_ONLY" != true ]; then
            echo "$ROUND" | grep -qE '^(fixed|week-[0-9]{4}-W[0-9]{2})$'
            if [ "$ROUND" = fixed ]; then cp -R rounds/fixed/. pool/; fi
            for a in arts/form-round-*; do t=${a#arts/form-round-}; rm -rf pool/*/"${t%-*}"; done
          fi
          for a in arts/form-round-*; do cp -R "$a"/round-out/. pool/; done
          find pool -name '*.png' -delete; ls pool
      - name: The forms file from the weekly-picks branch (the judge sees each posting's title and company)
        if: inputs.forms_from != ''
        env: {FROM: '${{ inputs.forms_from }}', FORMS: '${{ inputs.forms }}'}
        run: git fetch -q --depth 1 origin "${FROM%%:*}" && git show "FETCH_HEAD:${FROM#*:}" > "$FORMS"
      - name: Blind judge (the Claude plan; earlier verdicts reused)
        env: {CLAUDE_CODE_OAUTH_TOKEN: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}', FORMS: '${{ inputs.forms }}'}
        run: |
          set -o pipefail
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          node judge-blind.mjs pool --forms "$FORMS" 2>&1 | tee judge.log
      - name: Score the round
        run: |
          set -o pipefail
          node score-round.mjs pool --json score.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the round
        if: ${{ !inputs.judge_only }}
        env: {BENCHMARK_PUBLISH_KEY: '${{ secrets.BENCHMARK_PUBLISH_KEY }}'}
        run: node publish-fair.mjs pool --round "$ROUND"
      - name: The weekly note (Telegram, against the baseline and last week; kept on weekly-picks)
        if: ${{ !inputs.judge_only && inputs.weekly == 'yes' }}
        env:
          BENCH_TELEGRAM_BOT_TOKEN: ${{ secrets.BENCH_TELEGRAM_BOT_TOKEN }}
          BENCH_TELEGRAM_CHAT_ID: ${{ secrets.BENCH_TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          kind=week; base=(); name=$(date -u +%G-W%V); [ "$ROUND" = fixed ] && { kind=fixed; base=(--baseline rounds/fixed/baseline.json); name=$(date -u +%F); }   # fixed runs every 3 days: one note per day
          if git fetch -q origin weekly-picks && git worktree add -q picks FETCH_HEAD; then :; else git worktree add -q --orphan -b weekly-picks picks; fi
          mkdir -p "picks/notes/$kind"
          node weekly-note.mjs pool --round "$ROUND" "${base[@]}" --last "picks/notes/$kind" --out "picks/notes/$kind/$name.json" --url "$URL"
          cd picks && git add notes && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Note $ROUND $name"
          for _ in 1 2 3; do git pull -q --rebase origin weekly-picks 2>/dev/null; git push -q origin HEAD:weekly-picks && break; sleep 10; done
      - name: The judged round
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: form-round-judged-${{ inputs.judge_only && 'judge-only' || inputs.publish }}-${{ github.run_id }}
          retention-days: 90
          path: |
            judge.log
            score.json
            pool/**/judged.json
            pool/**/verdicts.json
            pool/**/manifest.json
            pool/**/result.json
